<svg width="1200" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - Soft Pastel Blue -->
  <rect width="1200" height="400" fill="#E8F4F8"/>
  
  <!-- Accent Bar - Pastel Red (Indonesian flag inspired) -->
  <rect x="0" y="0" width="1200" height="6" fill="#FFB3BA"/>
  
  <!-- Main Content Container -->
  <g transform="translate(100, 80)">
    <!-- Title -->
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#2C3E50">
      Indonesian Tech
    </text>
    <text x="0" y="60" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#2C3E50">
      Content Creator
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="110" font-family="Arial, sans-serif" font-size="20" fill="#5D6D7E">
      Agent Skill for AI Coding Assistants
    </text>
    
    <!-- Divider Line -->
    <line x1="0" y1="130" x2="400" y2="130" stroke="#FFB3BA" stroke-width="3"/>
    
    <!-- Platform List -->
    <g transform="translate(0, 160)">
      <circle cx="10" cy="10" r="8" fill="#BAFFC9"/>
      <text x="30" y="16" font-family="Arial, sans-serif" font-size="18" fill="#2C3E50">TikTok</text>
      
      <circle cx="160" cy="10" r="8" fill="#BAE1FF"/>
      <text x="180" y="16" font-family="Arial, sans-serif" font-size="18" fill="#2C3E50">YouTube</text>
      
      <circle cx="320" cy="10" r="8" fill="#FFFFBA"/>
      <text x="340" y="16" font-family="Arial, sans-serif" font-size="18" fill="#2C3E50">Instagram</text>
      
      <circle cx="490" cy="10" r="8" fill="#E8BAFF"/>
      <text x="510" y="16" font-family="Arial, sans-serif" font-size="18" fill="#2C3E50">Blog</text>
    </g>
    
    <!-- Features -->
    <text x="0" y="220" font-family="Arial, sans-serif" font-size="16" fill="#5D6D7E">
      Ideation  •  Scripting  •  Optimization  •  Scheduling  •  Monetization
    </text>
  </g>
  
  <!-- Right Side - Decorative Elements -->
  <g transform="translate(850, 100)">
    <!-- Code bracket icon -->
    <text x="0" y="0" font-family="Courier New, monospace" font-size="80" font-weight="bold" fill="#FFB3BA" opacity="0.3">
      { }
    </text>
    
    <!-- Small decorative circles -->
    <circle cx="50" cy="100" r="30" fill="#BAFFC9" opacity="0.4"/>
    <circle cx="150" cy="150" r="20" fill="#BAE1FF" opacity="0.4"/>
    <circle cx="80" cy="200" r="25" fill="#FFFFBA" opacity="0.4"/>
  </g>
  
  <!-- Bottom Bar - Pastel Red -->
  <rect x="0" y="394" width="1200" height="6" fill="#FFB3BA"/>
  
  <!-- Footer Text -->
  <text x="600" y="380" font-family="Arial, sans-serif" font-size="14" fill="#5D6D7E" text-anchor="middle">
    Open Source  •  MIT License  •  Made for Indonesian Developers
  </text>
</svg>
